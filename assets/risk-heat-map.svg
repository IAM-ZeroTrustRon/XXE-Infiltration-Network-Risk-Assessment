<text x="1014" y="270.9" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#9d2434">R04 • VERY HIGH • 20/25</text>
<text x="1014" y="307.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b46">Unauthorized remote commands</text>
<text x="1014" y="343.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Confirmed execution as the web-service account.</text>
<text x="1014" y="371.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Contain within 4 hours; validate trusted recovery.</text>
<rect x="990" y="410" width="562" height="158" fill="#ffffff"/>
<rect x="990" y="410" width="7" height="158" fill="#864310"/>
<text x="1014" y="443.9" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#864310">R01 + R02 • HIGH • 16/25</text>
<text x="1014" y="480.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b46">File disclosure and exposed secret</text>
<text x="1014" y="516.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Rotate the secret within 4 hours.</text>
<text x="1014" y="544.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Fix XML handling before return to service.</text>
<rect x="990" y="583" width="562" height="158" fill="#ffffff"/>
<rect x="990" y="583" width="7" height="158" fill="#864310"/>
<text x="1014" y="616.9" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#864310">R03 • HIGH • 12/25</text>
<text x="1014" y="653.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b46">Database reachable by probing source</text>
<text x="1014" y="689.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Restrict access to approved systems.</text>
<text x="1014" y="717.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Review within 1 day; test before service returns.</text>
<rect x="990" y="756" width="562" height="158" fill="#ffffff"/>
<rect x="990" y="756" width="7" height="158" fill="#725700"/>
<text x="1014" y="789.9" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#725700">R05 • MODERATE • 9/25</text>
<text x="1014" y="826.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172b46">Database access outcome unknown</text>
<text x="1014" y="862.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Review server audit records within 1 day.</text>
<text x="1014" y="890.9" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#172b46">Encrypted traffic does not prove login success.</text>
<text x="1010" y="966.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172b46">Targets are proposed from response authorization.</text>
<rect x="0" y="992" width="1600" height="128" fill="#e8edf5"/>
<text x="48" y="1032.7" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172b46">How to read this: risk score = likelihood × impact. Ratings are analyst estimates, not probabilities.</text>
<text x="48" y="1068.7" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b46">No remediation performed. Remaining risk cannot be rated until fixes are implemented and verified.</text>
<text x="48" y="1101.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#172b46">R05 is an evidence gap, not proof of missing logging. Assessment: Ron Richardson | October 5, 2026</text>
